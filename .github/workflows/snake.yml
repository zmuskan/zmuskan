
name: Generate Pink Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: zmuskan
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-pink.svg?palette=github-light&color_snake=%23E75480&color_dots=%23F8E8EE,%23F3B6CC,%23E88BAF,%23D9578B,%23A82C62

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
